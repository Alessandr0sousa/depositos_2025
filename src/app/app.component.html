<header class="header">
  <h2>{{ title }}</h2>
  <span class="somatorio h4">{{ somatorio }}</span>
</header>
<section>
  <article>
    <div class="container content row">
      <div *ngFor="let item of listaValores" class="form-check inline col-2">
        <input
          class="form-check-input"
          type="checkbox"
          id="checkbox{{ item }}"
          [value]="item"
          (click)="adicionarDepositoCheckado($event)"
        />
        <label class="form-check-label" for="checkbox{{ item }}">{{
          item
        }}</label>
      </div>
    </div>
  </article>
</section>
